# Project-wide Gradle settings.

# Increase JVM memory for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel compilation
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Enable configuration cache for faster builds
org.gradle.configuration-cache=true

# Use non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Use AndroidX
android.useAndroidX=true

# Enable Kotlin incremental compilation
kotlin.incremental=true

# Kotlin code style
kotlin.code.style=official
